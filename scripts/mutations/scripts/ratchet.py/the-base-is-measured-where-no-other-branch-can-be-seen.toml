[[rule]]
name = "the base is measured where no other branch can be seen"
file = "scripts/ratchet.py"
find = '^        \(\*ANY_COMMIT, "fetch", "-q", "--depth", "1", str\(ROOT\), sha\.stdout\.strip\(\)\),$'
replace = '("git", "fetch", "-q", str(ROOT), "+refs/heads/*:refs/heads/*"), (*ANY_COMMIT, "fetch", "-q", "--depth", "1", str(ROOT), sha.stdout.strip()),'
