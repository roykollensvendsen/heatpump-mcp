# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/heatpump_mcp/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "a status is kept for thirty seconds"
file = "src/heatpump_mcp/service.py"
find = 'if self._cached is not None and now - self._cached\[0\] < STATUS_CACHE_SECONDS:'
replace = 'if False:'

[[rule]]
name = "a temperature outside 16 to 28 degrees is refused"
file = "src/heatpump_mcp/service.py"
find = 'if not LOWEST <= degrees <= HIGHEST:'
replace = 'if False:'

[[rule]]
name = "a wrong token cancels the question"
file = "src/heatpump_mcp/service.py"
find = 'if pending is None or not secrets.compare_digest\(pending.token, token\):'
replace = 'if pending is None:'

[[rule]]
name = "a token expires after thirty seconds"
file = "src/heatpump_mcp/service.py"
find = 'if now - pending.asked_at >= TOKEN_SECONDS:'
replace = 'if False:'

[[rule]]
name = "only one change is sent per ten seconds"
file = "src/heatpump_mcp/service.py"
find = 'if self._last_sent is not None and now - self._last_sent < CHANGE_GAP_SECONDS:'
replace = 'if False:'

[[rule]]
name = "a change that never reached the unit can be confirmed again"
file = "src/heatpump_mcp/service.py"
find = 'self._pending = pending$'
replace = 'pass'

[[rule]]
name = "a change the unit does not show is said to be not confirmed"
file = "src/heatpump_mcp/service.py"
find = 'if reading is not None and change.shown_by\(reading\):'
replace = 'if reading is not None:'

[[rule]]
name = "reading back never starts a read that would end after the window"
file = "src/heatpump_mcp/service.py"
find = 'while self._clock\(\) \+ POLL_SECONDS \+ READ_SECONDS <= due:'
replace = 'while self._clock() < due:'

[[rule]]
name = "a change is sent without renewing a login the library still accepts"
file = "src/heatpump_mcp/fglair.py"
find = 'if not \(self\._api\.token_expired or self\._api\.token_expiring_soon\):'
replace = 'if False:'

[[rule]]
name = "a question renews a login that would run out before its yes"
file = "src/heatpump_mcp/fglair.py"
find = 'return left < LIBRARY_REFUSES_WITHIN \+ RENEW_AHEAD_SECONDS'
replace = 'return left < LIBRARY_REFUSES_WITHIN'

[[rule]]
name = "a login file others can read is refused"
file = "src/heatpump_mcp/settings.py"
find = 'if path.stat\(\).st_mode & \(stat.S_IRWXG \| stat.S_IRWXO\):'
replace = 'if False:'

[[rule]]
name = "a home-network address is never committed"
file = "scripts/private_data_scan.py"
find = 'found \+= \[f"line \{number\}: a home-network address" for _ in PRIVATE_IPV4\.findall\(line\)\]'
replace = 'pass'

[[rule]]
name = "a value from the settings folder is never committed"
file = "scripts/private_data_scan.py"
find = 'found \+= \[f"line \{number\}: a value from the settings folder" for s in secrets if s in line\]'
replace = 'pass'

[[rule]]
name = "an import a layer may not use is a breach"
file = "scripts/ratchet.py"
find = 'if layer\(inside\) not in ALLOWED\[mine\]:'
replace = 'if False:'

[[rule]]
name = "a module with no layer is a breach"
file = "scripts/ratchet.py"
find = 'if layer\(module\) == "unassigned":'
replace = 'if False:'

[[rule]]
name = "a measure that gets worse fails the check"
file = "scripts/ratchet.py"
find = 'if _worse\(metric, base\[metric\], now\[metric\]\) and metric not in allowed:'
replace = 'if False:'

[[rule]]
name = "when the levels main kept are missing, the base is measured"
file = "scripts/ratchet.py"
find = '^    return measure_base\(\)$'
replace = 'return {}'

[[rule]]
name = "a login entered again is used without a restart"
file = "src/heatpump_mcp/fglair.py"
find = 'if self\._unit is None or settings != self\._settings:'
replace = 'if self._unit is None:'

[[rule]]
name = "a sign-in that times out is never reported as sent"
file = "src/heatpump_mcp/service.py"
find = 'except \(UnitUnavailableError, TimeoutError\) as error:'
replace = 'except UnitUnavailableError as error:'

[[rule]]
name = "a refused login is not tried again until its wait is over"
file = "src/heatpump_mcp/fglair.py"
find = 'if self\._retry_at is not None and now < self\._retry_at:'
replace = 'if False:'
