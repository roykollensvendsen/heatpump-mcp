# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/heatpump_mcp/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "a status is kept for thirty seconds"
file = "src/heatpump_mcp/service.py"
find = 'if self._cached is not None and now - self._cached\[0\] < STATUS_CACHE_SECONDS:'
replace = 'if False:'

[[rule]]
name = "a temperature outside 16 to 28 degrees is refused"
file = "src/heatpump_mcp/service.py"
find = 'if not LOWEST <= degrees <= HIGHEST:'
replace = 'if False:'

[[rule]]
name = "a wrong token cancels the question"
file = "src/heatpump_mcp/service.py"
find = 'if pending is None or not secrets.compare_digest\(pending.token, token\):'
replace = 'if pending is None:'

[[rule]]
name = "a token expires after thirty seconds"
file = "src/heatpump_mcp/service.py"
find = 'if now - pending.asked_at >= TOKEN_SECONDS:'
replace = 'if False:'

[[rule]]
name = "only one change is sent per ten seconds"
file = "src/heatpump_mcp/service.py"
find = 'if self._last_sent is not None and now - self._last_sent < CHANGE_GAP_SECONDS:'
replace = 'if False:'

[[rule]]
name = "a change that never reached the unit can be confirmed again"
file = "src/heatpump_mcp/service.py"
find = 'self._pending = pending$'
replace = 'pass'

[[rule]]
name = "a change the unit does not show is said to be not confirmed"
file = "src/heatpump_mcp/service.py"
find = 'if reading is not None and change.shown_by\(reading\):'
replace = 'if reading is not None:'

[[rule]]
name = "reading back never starts a read that would end after the window"
file = "src/heatpump_mcp/service.py"
find = 'while self._clock\(\) \+ POLL_SECONDS \+ READ_SECONDS <= due:'
replace = 'while self._clock() < due:'

[[rule]]
name = "a login file others can read is refused"
file = "src/heatpump_mcp/settings.py"
find = 'if path.stat\(\).st_mode & \(stat.S_IRWXG \| stat.S_IRWXO\):'
replace = 'if False:'
